name: Geo-Test TV3 Varzesh

# Diagnose: prüft von GitHub-Runnern (US) aus, ob TV3 und Varzesh
# abspielbar sind. Body wird in Dateien geschrieben, auf stdout geht nur
# der HTTP-Code — sonst vermischt sich Manifest-Text mit dem Status.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/geo-test.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Runner-Standort
        run: curl -s -m 20 https://ipinfo.io/json || true

      - name: Ketten-Test
        run: |
          set -u
          W=/tmp/work; mkdir -p $W; cd $W

          # code <url> <datei>  ->  gibt nur den HTTP-Code aus
          code() {
            curl -sL -m 30 -A "Mozilla/5.0" -o "$2" -w "%{http_code}" "$1" 2>/dev/null || echo "ERR"
          }
          segcode() {
            curl -sL -m 30 -A "Mozilla/5.0" --range 0-8000 -o "$2" -w "%{http_code}" "$1" 2>/dev/null || echo "ERR"
          }

          # Kette prüfen: master -> media -> segment
          chain() {
            name="$1"; master="$2"
            mc=$(code "$master" m.m3u8)
            rel=$(grep -oE '[^"[:space:]]+\.m3u8' m.m3u8 2>/dev/null | tail -1)
            if [ -z "$rel" ]; then
              echo "$name | master=$mc | keine Varianten gefunden"; return
            fi
            case "$rel" in http*) media="$rel";; *) media="${master%/*}/$rel";; esac
            mc2=$(code "$media" md.m3u8)
            seg=$(grep -v '^#' md.m3u8 2>/dev/null | grep -v '^[[:space:]]*$' | head -1)
            if [ -z "$seg" ]; then
              echo "$name | master=$mc media=$mc2 | keine Segmente"; return
            fi
            case "$seg" in http*) surl="$seg";; *) surl="${media%/*}/$seg";; esac
            sc=$(segcode "$surl" seg.ts)
            sz=$(stat -c%s seg.ts 2>/dev/null || echo 0)
            verdict="GESPERRT"
            [ "$sc" = "200" ] || [ "$sc" = "206" ] && [ "$sz" -gt 8000 ] && verdict="LAEUFT"
            echo "$name | master=$mc media=$mc2 segment=$sc bytes=$sz -> $verdict"
          }

          {
            echo "=== TV3 / Varzesh Geo-Test ($(date -u +%F' '%T) UTC) ==="
            chain "TV1-Referenz"  "https://live-aburayhan1111.telewebion.net/ek/tv1/live/playlist.m3u8"
            chain "TV3-ncdn"      "https://ncdn.telewebion.ir/tv3/live/playlist.m3u8"
            chain "TV3-aburayhan" "https://live-aburayhan1103.telewebion.net/ek/tv3/live/playlist.m3u8"
            chain "Varzesh-ncdn"  "https://ncdn.telewebion.ir/varzesh/live/playlist.m3u8"
            chain "Varzesh-abu."  "https://live-aburayhan1109.telewebion.net/ek/varzesh/live/playlist.m3u8"
          } | tee /tmp/geo-result.txt

      - name: Ergebnis committen
        run: |
          cp /tmp/geo-result.txt geo-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geo-result.txt
          git diff --cached --quiet && { echo "keine Änderung"; exit 0; }
          git commit -m "test: Geo-Ergebnis $(date -u +%F)"
          for i in 1 2 3; do
            git push && break
            git fetch origin main && git rebase origin/main || true
            sleep 5
          done

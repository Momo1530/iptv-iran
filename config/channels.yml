# ─────────────────────────────────────────────────────────────────────
#  DEINE IPTV — Konfiguration
#
#  Alles hier ist deine Auswahl. Die Skripte bauen daraus automatisch
#  deine Playlists. Nach jeder Änderung einfach committen/pushen —
#  GitHub Actions baut die Listen dann neu.
# ─────────────────────────────────────────────────────────────────────

# ── Quellen ──────────────────────────────────────────────────────────
# Öffentliche, regelmäßig gepflegte Iran-Listen, aus denen deine Kanäle
# gesammelt werden.
sources:
  shayanline:
    enabled: true
    url: https://raw.githubusercontent.com/shayanline/iptv-iran/main/playlists/iran.m3u
  # Erweiterte Liste: ~3 Stream-Varianten pro Kanal. Wichtig, weil bei den
  # Telewebion-Sendern oft nur einzelne Varianten geo-blockiert sind —
  # die anderen laufen. Ohne diese Quelle wären 17 Kanäle unnötig gesperrt.
  shayanline_all:
    enabled: true
    url: https://raw.githubusercontent.com/shayanline/iptv-iran/main/playlists/iran-all-streams.m3u
  iptv_org:
    enabled: true
    urls:
      - https://raw.githubusercontent.com/iptv-org/iptv/master/streams/ir.m3u
      - https://raw.githubusercontent.com/iptv-org/iptv/master/streams/ir_telewebion.m3u

# ── Auswahl ──────────────────────────────────────────────────────────
# Nur diese Kanäle behalten (Kanal-ID oder Name, * als Platzhalter).
# Leer lassen = ALLE Kanäle behalten.
include: []
  # - "IRIB*"
  # - "Persiana*"
  # - "BBC*"

# Diese Kanäle immer entfernen (* als Platzhalter)
exclude: []
  # - "*test*"
  # - "*shopping*"

# Nur Streams behalten, die beim Prüfen WIRKLICH laufen?
#   false = alles behalten. Nicht erreichbare (z. B. geo-blockierte
#           IRIB-Sender) bleiben drin und werden mit [IR] markiert.
#   true  = nur geprüfte, laufende Streams (kleinere, aber sichere Liste)
verified_only: false

# Geo-blockierte Kanäle ganz aus momo.m3u entfernen?
#   true  = raus. Sinnvoll OHNE iranisches VPN — die Sender laufen sonst
#           ohnehin nicht. Bleiben nur in den Kategorie-Listen erhalten.
#   false = bleiben drin, mit [IR] im Namen markiert.
drop_geo: true

# ── Eigene Kanäle ────────────────────────────────────────────────────
# Werden IMMER behalten und stehen ganz oben in der Liste. Ein Kanal hier
# VERDRÄNGT die generische Version derselben tvg-id.
custom:
  # IRIB TV3 und IRIB Varzesh sind bei Telewebion hart geo-blockiert
  # (alle Varianten, Proxies, IPv6, US-Runner → Segmente 403). Über
  # adabmedia laufen beide in 720p ohne VPN. ID/group absichtlich gleich
  # gesetzt, damit sie die Kategorie "IRIB National Networks" erben und
  # die gesperrten Telewebion-Einträge verdrängen.
  - name: "IRIB TV3"
    id: "IRIB3.ir"
    url: "https://cp11.adabmedia.com/hls2/tv3test.m3u8"
    group: "IRIB National Networks"
    quality: "HD"
  - name: "IRIB Varzesh"
    id: "VarzeshTV.ir"
    url: "https://cp11.adabmedia.com/hls2/varzeshtest.m3u8"
    group: "IRIB National Networks"
    quality: "HD"

  # ── Adel (عادل فردوسی‌پور) ─────────────────────────────────────────
  # Quellen: football360.ir (VODs über arvanstorage, direkt abspielbar).
  # Der 24/7-TV-Kanal liegt hinter aparatsport.com und ist hart
  # Iran-geo-blockiert (403 "VPN Error", IPv6 + Proxies erfolglos).
  # Die Sendungen hier laufen dagegen ohne VPN.
  - name: "Adel · خانه‌ای برای همیشه"
    url: "https://s3.ir-thr-at1.arvanstorage.ir/site-videos/Amin/full%20live6..mp4"
    group: "Adel"
  - name: "Adel · Highlights Real Madrid 2-1 Inter"
    url: "https://s3.ir-thr-at1.arvanstorage.ir/site-videos/Hossein/inter-real.mp4"
    group: "Adel"
  - name: "Adel · Spiel komplett Spanien–Argentinien"
    url: "https://s3.ir-thr-at1.arvanstorage.ir/site-videos/Hossein/%E2%80%8Cspa%20arg.mp4"
    group: "Adel"
  - name: "Adel · Highlights Spanien 1-0 Argentinien (WM-Finale)"
    url: "https://s3.ir-thr-at1.arvanstorage.ir/site-videos/Hossein/Spain-Argentina%20with%20cup%20new.mp4"
    group: "Adel"
  - name: "Adel · Spiel komplett England–Argentinien"
    url: "https://s3.ir-thr-at1.arvanstorage.ir/site-videos/Hossein/arg%20eng%20full.mp4"
    group: "Adel"
  # - name: "Mein Sender"
  #   url: "https://example.com/stream.m3u8"
  #   logo: "https://example.com/logo.png"
  #   group: "Eigene"

# ── Stream-URLs ersetzen ─────────────────────────────────────────────
# Falls du für einen Kanal eine bessere/andere Quelle hast.
overrides: {}
  # IRIB1.ir: https://andere-url.example/stream.m3u8

# ── Reihenfolge der Gruppen in der fertigen Playlist ─────────────────
group_order:
  - "Eigene"
  - "Adel"
  - "IRIB National Networks"
  - "IRIB Provincial Networks"
  - "IRIB International Services"
  - "Satellite · News & Current Affairs"
  - "Satellite · Sports"
  - "Satellite · Film & Series"
  - "Satellite · General & Variety"
  - "Satellite · Children"
  - "Satellite · Music"
  - "Satellite · Factual, Culture & Lifestyle"
  - "Religious · Islamic"
  - "Religious · Christian"
  - "Religious · Other Faiths & Spiritual"
  - "Other"
